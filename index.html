<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Private Google integration used by Hermes Agent">
  <title>Private Google integration</title>
  <style>
    :root { color-scheme: light; --ink: #1d2833; --muted: #5e6b76; --accent: #2457a6; --line: #dce3e8; --wash: #f5f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--wash); }
    main { max-width: 720px; margin: 0 auto; padding: 12vh 24px 10vh; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: clamp(28px, 6vw, 56px); box-shadow: 0 12px 35px rgba(29, 40, 51, .06); }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 18px; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.1; letter-spacing: -.04em; }
    p { margin: 0 0 18px; color: var(--muted); }
    a { color: var(--accent); font-weight: 650; }
    footer { margin-top: 28px; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <p class="eyebrow">Private integration</p>
      <h1>Hermes Agent</h1>
      <p>This is a private Google integration used by Hermes Agent for its owner.</p>
      <footer><a href="privacy.html">Read the privacy policy</a></footer>
    </section>
  </main>
</body>
</html>
