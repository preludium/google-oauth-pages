<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Privacy policy for a private Google integration used by Hermes Agent">
  <title>Privacy policy · Hermes Agent</title>
  <style>
    :root { --ink: #1d2833; --muted: #5e6b76; --accent: #2457a6; --line: #dce3e8; --wash: #f5f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--wash); }
    main { max-width: 760px; margin: 0 auto; padding: 9vh 24px 10vh; }
    article { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: clamp(28px, 6vw, 56px); box-shadow: 0 12px 35px rgba(29, 40, 51, .06); }
    h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.15; letter-spacing: -.035em; }
    p { margin: 0 0 14px; color: var(--muted); }
    a { color: var(--accent); font-weight: 650; }
    .updated { margin-bottom: 28px; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>Privacy policy</h1>
      <p class="updated">Private Google integration used by Hermes Agent</p>
      <p>Information is processed only for operations requested by the owner, is not sold or shared, and credentials are stored privately on the homelab.</p>
      <p><a href="index.html">Back to the integration page</a></p>
    </article>
  </main>
</body>
</html>
